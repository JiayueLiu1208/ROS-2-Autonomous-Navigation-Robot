liu_odometry_from_encoders:
  ros__parameters:
    wheel_radius_left: 0.072
    # Slightly increase right wheel distance estimate to counter rightward
    # odometry drift during physically straight starts.
    wheel_radius_right: 0.0729
    half_wheel_base: 0.109
    counts_per_revolution: 4480.0
    k_l: 5.15e-5
    k_r: 2.39e-4
    x_initial: 0.0
    y_initial: 0.0
    phi_initial: 0.0
    publish_odom_topic: "wheel_odometry"
    save_directory: "~/asclinic-ros2/ros2_ws/results/odom_logs"
    verbose: false

pitt_fused_odemetry:
  ros__parameters:
    wheel_odom_topic: "wheel_odometry"
    aruco_topic: "aruco_detections"
    fused_odom_topic: "pitt_fused_odometry"
    vision_odom_topic: "pitt_vision_odometry"
    use_pitt_kalman_filter: true
    camera_in_base_x: 0.0
    camera_in_base_y: 0.0
    camera_in_base_yaw: 0.041
    marker_world_map: "1:0.00,1.00,0.30,0;2:0.00,3.60,0.30,0;3:0.00,6.60,0.30,0;4:0.00,9.60,0.30,0;5:15.00,1.00,0.30,180;6:15.00,3.60,0.30,180;7:15.00,6.60,0.30,180;8:15.00,9.60,0.30,180;9:5.00,0.00,0.30,90;10:8.00,0.00,0.30,90;11:11.00,0.00,0.30,90;12:14.00,0.00,0.30,90;13:5.00,10.80,0.30,-90;14:8.00,10.80,0.30,-90;15:11.00,10.80,0.30,-90;16:14.00,10.80,0.30,-90;18:8.20,5.20,0.30,0;19:7.80,5.20,0.30,180;20:8.00,5.40,0.30,90;22:8.00,5.00,0.30,-90;27:1.50,3.60,0.30,90;29:8.00,1.30,0.30,180"
    process_q_x: 0.0002
    process_q_y: 0.0002
    process_q_yaw: 0.0001
    vision_r_x: 0.05
    vision_r_y: 0.05
    vision_r_yaw: 0.08
    off_axis_skip_deg: 22.0
    incidence_skip_deg: 60.0
    vision_yaw_gate_deg: 25.0
    use_vision_yaw_for_position: false
    use_vision_yaw_update: true
    use_vision_xy_yaw_coupling: false
    use_multi_marker_fusion: true
    vision_min_markers: 1
    vision_max_marker_range_m: 7.0
    single_marker_max_range_m: 5.5
    vision_outlier_rejection_m: 2.50
    vision_update_period_s: 1.5
    vision_filter_window_s: 1.6
    vision_filter_min_samples: 3
    vision_filter_max_std_m: 0.35
    vision_filter_max_jump_m: 0.75
    vision_correction_step_limit_m: 0.45
    use_lidar_wall_update: true
    use_lidar_wall_yaw_update: true
    lidar_wall_odom_topic: "pitt_lidar_wall_odometry"
    lidar_wall_update_period_s: 1.0
    lidar_wall_outlier_rejection_m: 0.35
    lidar_wall_yaw_gate_deg: 8.0
    lidar_wall_correction_step_limit_m: 0.08
    lidar_wall_yaw_step_limit_deg: 2.0
    lidar_wall_r_x: 0.025
    lidar_wall_r_y: 0.025
    lidar_wall_r_yaw: 0.006
    lidar_wall_unconstrained_variance: 100.0
    use_lidar_scanmatch_update: false
    use_lidar_scanmatch_yaw_update: false
    lidar_scanmatch_odom_topic: "pitt_lidar_scanmatch_odometry"
    lidar_scanmatch_update_period_s: 1.0
    lidar_scanmatch_max_score_m: 0.06
    lidar_scanmatch_min_valid_fraction: 0.90
    lidar_scanmatch_min_match_fraction: 0.45
    lidar_scanmatch_outlier_rejection_m: 0.25
    lidar_scanmatch_yaw_gate_deg: 3.0
    lidar_scanmatch_correction_step_limit_m: 0.06
    lidar_scanmatch_yaw_step_limit_deg: 1.0
    lidar_scanmatch_filter_window_s: 2.5
    lidar_scanmatch_filter_min_samples: 3
    lidar_scanmatch_filter_max_std_m: 0.08
    lidar_scanmatch_filter_max_jump_m: 0.12
    lidar_scanmatch_r_x: 0.10
    lidar_scanmatch_r_y: 0.10
    lidar_scanmatch_r_yaw: 0.04
    verbosity: 2

lidar_wall_localizer:
  ros__parameters:
    enabled: true
    scan_topic: "/scan"
    odom_topic: "pitt_fused_odometry"
    wall_odom_topic: "pitt_lidar_wall_odometry"
    debug_marker_topic: "lidar_wall_debug"
    frame_id: "odom"
    room_width_m: 15.0
    room_height_m: 10.8
    wall_margin_m: 0.20
    wall_update_radius_m: 2.0
    virtual_wall_ids: ["left"]
    lidar_in_base_x: 0.0
    lidar_in_base_y: 0.0
    lidar_in_base_yaw_deg: 0.0
    lidar_scan_angle_multiplier: 1.0
    lidar_forward_is_backward: true
    beam_stride: 3
    min_range_m: 0.08
    max_range_m: 4.5
    association_distance_m: 0.45
    line_inlier_residual_m: 0.08
    max_fit_residual_std_m: 0.06
    min_wall_inliers: 25
    min_wall_span_m: 0.45
    max_line_angle_error_deg: 15.0
    update_period_sec: 1.0
    scan_timeout_sec: 0.40
    odom_timeout_sec: 0.50
    max_update_angular_speed_rad_s: 0.18
    post_turn_settle_sec: 0.45
    max_update_linear_speed_m_s: 0.30
    max_position_correction_m: 0.12
    max_yaw_correction_deg: 3.0
    position_variance_min: 0.010
    yaw_variance_min: 0.003
    unconstrained_variance: 100.0
    publish_debug_markers: true
    verbose: false
    skip_log_period_sec: 1.5

lidar_scan_match_localizer:
  ros__parameters:
    enabled: true
    scan_topic: "/scan"
    map_topic: "/map"
    prior_odom_topic: "pitt_fused_odometry"
    matched_odom_topic: "pitt_lidar_scanmatch_odometry"
    debug_points_topic: "lidar_scanmatch_points"
    frame_id: "map"
    lidar_in_base_x: 0.0
    lidar_in_base_y: 0.0
    lidar_in_base_yaw_deg: 0.0
    lidar_scan_angle_multiplier: 1.0
    lidar_forward_is_backward: true
    beam_stride: 4
    min_range_m: 0.10
    max_range_m: 4.5
    min_valid_points: 35
    occupied_threshold: 90
    update_period_sec: 0.75
    scan_timeout_sec: 0.50
    prior_timeout_sec: 0.60
    search_xy_radius_m: 0.35
    search_xy_step_m: 0.07
    search_yaw_radius_deg: 12.0
    search_yaw_step_deg: 3.0
    fine_xy_radius_m: 0.08
    fine_xy_step_m: 0.02
    fine_yaw_radius_deg: 3.0
    fine_yaw_step_deg: 0.75
    trim_fraction: 0.65
    distance_score_cap_m: 0.75
    out_of_map_penalty_m: 0.35
    max_accepted_score_m: 0.22
    prior_xy_weight: 0.015
    prior_yaw_weight: 0.025
    position_variance_min: 0.015
    yaw_variance_min: 0.006
    publish_debug_points: true
    debug_point_distance_gate_m: 0.18
    verbose: true
    skip_log_period_sec: 1.5
